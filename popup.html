<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <div class="popup">
      <header class="header">
        <div class="brand-mark" aria-hidden="true"><i></i><i></i><i></i><i></i></div>
        <div class="brand-copy">
          <div class="brand-title">Lasso</div>
          <div class="brand-subtitle">Frame anything on the web</div>
        </div>
        <span class="shortcut">Ctrl&nbsp;Shift&nbsp;S</span>
      </header>

      <section class="hero-note" aria-label="Capture guidance">
        <h1>Frame what matters.</h1>
        <p class="hero-copy">Every mode opens an adjustable selection before export.</p>
      </section>

      <main class="capture-menu">
        <div class="menu-heading">Start with</div>

        <button id="btn-visible" class="mode mode-featured" type="button">
          <span class="mode-icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect width="18" height="18" x="3" y="3" rx="2"/><path d="M3 9h18"/><path d="M9 21V9"/></svg></span>
          <span class="mode-text"><strong>Visible area</strong><small>The viewport you see now</small></span>
          <span class="mode-action">Capture</span>
        </button>

        <div class="mode-pair">
          <button id="btn-pick" class="mode" type="button">
            <span class="mode-icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4.037 4.688a.495.495 0 0 1 .651-.651l16 6.5a.5.5 0 0 1-.063.947l-6.124 1.58a2 2 0 0 0-1.438 1.435l-1.579 6.126a.5.5 0 0 1-.947.063z"/></svg></span>
            <span class="mode-text"><strong>Pick an element</strong><small>Click, then Shift-click to add</small></span>
          </button>
          <button id="btn-freestyle" class="mode" type="button">
            <span class="mode-icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7V5a2 2 0 0 1 2-2h2"/><path d="M17 3h2a2 2 0 0 1 2 2v2"/><path d="M21 17v2a2 2 0 0 1-2 2h-2"/><path d="M7 21H5a2 2 0 0 1-2-2v-2"/><path d="M7 12h10"/></svg></span>
            <span class="mode-text"><strong>Draw a region</strong><small>Drag your own frame</small></span>
          </button>
        </div>

        <button id="btn-fullpage" class="mode mode-quiet" type="button">
          <span class="mode-icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="m9 10 3-3 3 3"/><path d="M12 13V7"/><rect width="20" height="14" x="2" y="3" rx="2"/><path d="M12 17v4"/><path d="M8 21h8"/></svg></span>
          <span class="mode-text"><strong>Entire page</strong><small>Scroll, stitch, and frame the result</small></span>
          <span class="mode-action">Long capture</span>
        </button>
      </main>

      <footer class="footer">
        <label class="format-setting" for="format-select"><span>File format</span><select id="format-select"><option value="png">PNG</option><option value="jpeg">JPEG</option><option value="webp">WebP</option></select></label>
        <p class="footer-note">Clipboard copies stay PNG for reliability.</p>
      </footer>
    </div>
    <script src="messages.js"></script>
    <script src="popup.js"></script>
  </body>
</html>
